<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111216" />
    <meta name="application-name" content="Thiscord" />
    <meta
      name="description"
      content="Thiscord brings communities, messages, voice, and video together."
    />
    <title>Thiscord</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (
        (location.hostname === '127.0.0.1' || location.hostname === 'localhost')
        && location.port === '5173'
        && 'serviceWorker' in navigator
        && navigator.serviceWorker.controller
        && !sessionStorage.getItem('thiscord-dev-sw-reset')
      ) {
        sessionStorage.setItem('thiscord-dev-sw-reset', '1')
        Promise.all([
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))),
          caches.keys()
            .then((keys) => Promise.all(keys.filter((key) => key.startsWith('thiscord-')).map((key) => caches.delete(key)))),
        ]).then(() => location.reload())
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
