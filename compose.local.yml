name: thiscord-dev

x-jitsi-environment: &jitsi-environment
  AUTH_TYPE: jwt
  ENABLE_AUTH: "1"
  ENABLE_GUESTS: "0"
  ENABLE_XMPP_WEBSOCKET: "0"
  BOSH_RELATIVE: "1"
  DISABLE_HTTPS: "1"
  ENABLE_HTTP_REDIRECT: "0"
  ENABLE_LETSENCRYPT: "0"
  ENABLE_PREJOIN_PAGE: "0"
  ENABLE_WELCOME_PAGE: "0"
  ENABLE_CLOSE_PAGE: "1"
  PUBLIC_URL: 127.0.0.1:8443
  JWT_APP_ID: thiscord
  JWT_APP_SECRET: thiscord-local-development-jitsi-secret
  JWT_ACCEPTED_ISSUERS: thiscord
  JWT_ACCEPTED_AUDIENCES: thiscord
  JICOFO_AUTH_PASSWORD: thiscord-local-jicofo-password
  JVB_AUTH_PASSWORD: thiscord-local-jvb-password
  XMPP_DOMAIN: meet.jitsi
  XMPP_AUTH_DOMAIN: auth.meet.jitsi
  XMPP_GUEST_DOMAIN: guest.meet.jitsi
  XMPP_MUC_DOMAIN: muc.meet.jitsi
  XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
  XMPP_HIDDEN_DOMAIN: hidden.meet.jitsi
  XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
  XMPP_MODULES: presence_identity
  XMPP_SERVER: prosody
  XMPP_PORT: "5222"
  XMPP_BOSH_URL_BASE: http://prosody:5280
  JVB_BREWERY_MUC: jvbbrewery
  JVB_PORT: "10000"
  JVB_ADVERTISE_IPS: ${DEV_JVB_ADVERTISE_IPS:-127.0.0.1}
  JVB_ADVERTISE_PRIVATE_CANDIDATES: "false"
  JVB_DISABLE_STUN: "1"
  TURN_HOST: 127.0.0.1
  TURN_PORT: "3478"
  TURN_TRANSPORT: udp
  TURN_USERNAME: thiscord
  TURN_PASSWORD: thiscord-local-turn-password
  TZ: ${TZ:-UTC}

services:
  pocketbase:
    build:
      context: packages/pocketbase
      args:
        POCKETBASE_VERSION: "0.39.9"
    restart: unless-stopped
    environment:
      POCKETBASE_DEV: "true"
      JITSI_DOMAIN: 127.0.0.1:8443
      JITSI_URL: http://127.0.0.1:8443
      JITSI_APP_ID: thiscord
      JITSI_APP_SECRET: thiscord-local-development-jitsi-secret
      JITSI_CONTROL_URL: http://prosody:5280/thiscord-call-control
      THISCORD_PUBLIC_URL: http://127.0.0.1:5173
      POCKETBASE_PUBLIC_URL: http://127.0.0.1:8090
      THISCORD_APP_NAME: Thiscord
      POCKETBASE_ORIGINS: "*"
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/app/pb_data
      - ./packages/pocketbase/pb_hooks:/app/pb_hooks:ro
      - ./packages/pocketbase/pb_migrations:/app/pb_migrations:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  jitsi-web:
    image: jitsi/web:stable-10978
    restart: unless-stopped
    depends_on:
      - jvb
    environment:
      <<: *jitsi-environment
    ports:
      - "8443:80"
    volumes:
      - jitsi_web_config:/config
      - jitsi_transcripts:/usr/share/jitsi-meet/transcripts

  prosody:
    image: thiscord/prosody:stable-10978
    build:
      context: ./infra/jitsi
      dockerfile: prosody.Dockerfile
    restart: unless-stopped
    environment:
      <<: *jitsi-environment
      GLOBAL_MODULES: thiscord_call_control
      THISCORD_CALL_CONTROL_SECRET: thiscord-local-development-jitsi-secret
    volumes:
      - jitsi_prosody_config:/config

  jicofo:
    image: jitsi/jicofo:stable-10978
    restart: unless-stopped
    depends_on:
      - prosody
    environment:
      <<: *jitsi-environment
    volumes:
      - jitsi_jicofo_config:/config

  jvb:
    image: jitsi/jvb:stable-10978
    restart: unless-stopped
    depends_on:
      - prosody
    environment:
      <<: *jitsi-environment
    ports:
      - "10000:10000/udp"
    volumes:
      - jitsi_jvb_config:/config

  coturn:
    image: coturn/coturn:4.6.3-r3-alpine
    restart: unless-stopped
    command:
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=127.0.0.1
      - --user=thiscord:thiscord-local-turn-password
      - --external-ip=${DEV_JVB_ADVERTISE_IPS:-127.0.0.1}
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  pocketbase_data:
  jitsi_web_config:
  jitsi_transcripts:
  jitsi_prosody_config:
  jitsi_jicofo_config:
  jitsi_jvb_config:
