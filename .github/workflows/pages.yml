name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Select Pages base path
        shell: bash
        env:
          CONFIGURED_BASE: ${{ vars.PUBLIC_BASE_PATH }}
        run: |
          if [ -n "$CONFIGURED_BASE" ]; then
            echo "PUBLIC_BASE_PATH=$CONFIGURED_BASE" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi
      - name: Validate public endpoints
        env:
          DISTRIBUTION_FILE: infra/distribution.json
        run: node scripts/validate-web-config.mjs
      - name: Build static frontend
        env:
          DISTRIBUTION_FILE: infra/distribution.json
        run: npm run build --workspace @thiscord/renderer
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/renderer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
