name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Create deployment configuration
        shell: bash
        env:
          DISTRIBUTION_JSON: ${{ vars.DISTRIBUTION_JSON }}
        run: |
          if [ -z "$DISTRIBUTION_JSON" ]; then
            echo "Set the DISTRIBUTION_JSON repository variable before deploying."
            exit 1
          fi
          printf '%s\n' "$DISTRIBUTION_JSON" > infra/distribution.pages.json
          echo "DISTRIBUTION_FILE=infra/distribution.pages.json" >> "$GITHUB_ENV"
      - name: Select Pages base path
        shell: bash
        env:
          CONFIGURED_BASE: ${{ vars.PUBLIC_BASE_PATH }}
        run: |
          if [ -n "$CONFIGURED_BASE" ]; then
            echo "PUBLIC_BASE_PATH=$CONFIGURED_BASE" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi
      - name: Validate public endpoints
        run: node scripts/validate-web-config.mjs
      - name: Build static frontend
        run: |
          npm run build --workspace @thiscord/shared
          npm run build --workspace @thiscord/renderer
      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx --yes gh-pages@6.3.0 \
            --dist apps/renderer/dist \
            --branch gh-pages \
            --nojekyll \
            --message "deploy: frontend ${GITHUB_SHA}"
