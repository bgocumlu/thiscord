name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Test renderer UI
        run: npm run test:ui --workspace @thiscord/renderer
      - run: npm run smoke
      - name: Validate Compose deployment
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f compose.local.yml config --quiet
      - name: Prepare vendored PocketBase
        run: |
          cd packages/pocketbase/vendor/pocketbase/0.39.9/linux_amd64
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          mkdir -p .pocketbase
          cp packages/pocketbase/vendor/pocketbase/0.39.9/linux_amd64/pocketbase .pocketbase/pocketbase
          chmod +x .pocketbase/pocketbase
      - name: Test PocketBase migrations and protected routes
        run: npm run smoke --workspace @thiscord/pocketbase
        env:
          POCKETBASE_BINARY: ${{ github.workspace }}/.pocketbase/pocketbase
      - name: Audit production dependencies
        run: npm audit --omit=dev
